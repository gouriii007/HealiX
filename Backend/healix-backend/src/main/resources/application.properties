# =============================================================
# Healix Hospital Management System - Application Configuration
# =============================================================
# KTU B.Tech CSE S3 OOP Project
# IMPORTANT: Update the datasource credentials before running.
# =============================================================

# ---- Application Info ----
spring.application.name=Healix HMS
server.port=8080

# ---- MySQL Database Configuration ----
# Update these values with your local MySQL installation details
spring.datasource.url=jdbc:mysql://localhost:3306/healix_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate Configuration ----
# update = update schema automatically; use create-drop for fresh start
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- SQL Init (schema.sql + data.sql) ----
# Set to 'always' to run schema.sql and data.sql on startup
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ---- Thymeleaf Configuration ----
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- Security ----
# We configure Spring Security programmatically in SecurityConfig.java
# These are just for reference
spring.security.user.name=admin
spring.security.user.password=ignored-we-use-db

# ---- File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging ----
logging.level.com.healix=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ---- Error handling ----
server.error.whitelabel.enabled=false
server.error.path=/error
