# ---- Application Info ----
spring.application.name=Healix HMS
server.port=8080

# ---- Supabase PostgreSQL Database Configuration ----
# Environment variables: SUPABASE_DB_URL, SUPABASE_DB_USERNAME, SUPABASE_DB_PASSWORD
# Fallback support: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}}
spring.datasource.username=${SUPABASE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres.sfipnjknotlfbfhdlenr}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Healix2026#Supabase!Secure}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate Configuration for PostgreSQL ----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ---- SQL Init (schema.sql + data.sql) ----
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

# ---- Thymeleaf Configuration ----
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- Security ----
# We configure Spring Security programmatically in SecurityConfig.java
# These are just for reference
spring.security.user.name=admin
spring.security.user.password=ignored-we-use-db

# ---- File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging ----
logging.level.com.healix=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ---- Error handling ----
server.error.whitelabel.enabled=false
server.error.path=/error

# ---- Multi-Hospital Platform Configuration ----
app.ai.mode=mock
app.payment.mode=mock
app.sms.mode=mock
app.otp.expiry-minutes=5
app.hospital.default-city=Thiruvananthapuram
