<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' | Healix HMS' : 'Healix Hospital Management System'}">Healix HMS</title>
    <meta name="description" th:content="${metaDesc != null ? metaDesc : 'Healix Hospital Management System - Professional Healthcare Administration'}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <th:block th:replace="${extraHead} ?: ~{}"/>
</head>
<body>

<!-- ======================== SIDEBAR OVERLAY (mobile) ======================== -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<!-- ======================== SIDEBAR ======================== -->
<div th:fragment="adminSidebar" id="sidebar"
     class="sidebar"
     th:classappend="${portalRole == 'PATIENT' ? 'sidebar-patient' : (portalRole == 'DOCTOR' ? 'sidebar-doctor' : '')}">
    <div class="sidebar-header">
        <div class="sidebar-logo">H</div>
        <div>
            <div class="sidebar-title">Healix</div>
            <div class="sidebar-subtitle" th:text="${portalRole != null ? portalRole + ' Portal' : 'Portal'}">Admin Portal</div>
        </div>
    </div>
    <nav class="sidebar-nav" th:replace="${sidebarContent} ?: ~{}"></nav>
    <div class="sidebar-footer">
        <a href="/logout" class="nav-item" style="color:rgba(255,255,255,0.6);">
            <i class="bi bi-box-arrow-left nav-icon"></i> Logout
        </a>
    </div>
</div>

</body>
</html>
