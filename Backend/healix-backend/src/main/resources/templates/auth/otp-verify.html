<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>OTP Verification | MediCare Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body style="background: #F9FAFB; display: flex; align-items: center; justify-content: center; min-height: 100vh;">

<div style="background: #FFFFFF; max-width: 440px; width: 100%; margin: 1.5rem; padding: 2.5rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #E5E7EB; text-align: center;">

    <div style="width: 64px; height: 64px; background: #EDE7F6; color: #5E35B1; border-radius: 16px; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 1.75rem;">
        <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h2 style="font-size: 1.6rem; font-weight: 800; color: #111827; margin-bottom: 0.5rem;">OTP Verification</h2>
    <p style="color: #6B7280; font-size: 0.92rem; line-height: 1.5; margin-bottom: 1.5rem;">
        Enter the 6-digit verification code sent to your registered mobile / email address:
        <br/><strong style="color: #111827;" th:text="${identifier}">user@example.com</strong>
    </p>

    <!-- Error / Info Alerts -->
    <div th:if="${errorMessage}" class="alert alert-error mb-3" style="background: #FEF2F2; color: #991B1B; padding: 0.75rem; border-radius: 8px; font-size: 0.88rem;">
        <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${infoMessage}" class="alert alert-info mb-3" style="background: #EDE7F6; color: #5E35B1; padding: 0.75rem; border-radius: 8px; font-size: 0.88rem;">
        <i class="bi bi-info-circle-fill"></i> <span th:text="${infoMessage}"></span>
    </div>

    <form th:action="@{/auth/otp/verify}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="identifier" th:value="${identifier}"/>
        <input type="hidden" name="purpose" th:value="${purpose}"/>

        <div style="margin-bottom: 1.5rem;">
            <input type="text" name="otpCode" maxlength="6" pattern="[0-9]{6}" required
                   placeholder="• • • • • •"
                   style="width: 100%; text-align: center; font-size: 2rem; letter-spacing: 0.5em; font-weight: 700; padding: 0.75rem; border-radius: 12px; border: 2px solid #E5E7EB; outline: none; transition: border-color 0.2s;"
                   onfocus="this.style.borderColor='#8070A6'" onblur="this.style.borderColor='#E5E7EB'"/>
        </div>

        <button type="submit" class="ref-pill-btn" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1rem; margin-bottom: 1rem;">
            Verify OTP
        </button>
    </form>

    <form th:action="@{/auth/otp/resend}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="identifier" th:value="${identifier}"/>
        <input type="hidden" name="purpose" th:value="${purpose}"/>
        <div style="font-size: 0.88rem; color: #6B7280; margin-bottom: 1.25rem;">
            Didn't receive the code?
            <button type="submit" style="background: none; border: none; color: #8070A6; font-weight: 600; cursor: pointer; text-decoration: underline;">Resend OTP</button>
        </div>
    </form>

    <div style="border-top: 1px solid #E5E7EB; padding-top: 1.25rem;">
        <a th:href="@{/login}" style="color: #6B7280; font-size: 0.9rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 500;">
            <i class="bi bi-arrow-left"></i> Skip &amp; Return to Login
        </a>
    </div>

</div>

</body>
</html>
