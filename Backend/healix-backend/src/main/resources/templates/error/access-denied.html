<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Access Denied | Healix HMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F8F9FA;
            padding: 24px;
        }
        .error-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 48px;
            max-width: 520px;
            text-align: center;
            border: 1px solid #E5E7EB;
        }
        .error-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #FEE2E2;
            color: #EF4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 24px;
        }
    </style>
</head>
<body>
<div class="error-page">
    <div class="error-card">
        <div class="error-icon">
            <i class="bi bi-shield-x"></i>
        </div>
        <h1 style="font-size: 1.8rem; font-weight: 800; color: #0F2042; margin-bottom: 8px;">Access Denied (403)</h1>
        <p style="color: #4B5563; font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px;">
            You do not have administrative or portal permissions to view the requested resource. Please check your role credentials or return to your portal.
        </p>
        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <a href="/" class="btn btn-outline"><i class="bi bi-house"></i> Home Page</a>
            <a href="/login" class="btn btn-primary"><i class="bi bi-box-arrow-in-right"></i> Sign In With Another Account</a>
        </div>
    </div>
</div>
</body>
</html>
