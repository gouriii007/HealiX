<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${doctorId != null ? 'Edit Doctor' : 'Add Doctor'} + ' | Healix Admin'">Doctor Form | Healix Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-layout">
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">H</div>
            <div><div class="sidebar-title">Healix</div><div class="sidebar-subtitle">Admin Portal</div></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">Main Menu</div>
            <a href="/admin/dashboard" class="nav-item"><i class="bi bi-speedometer2 nav-icon"></i> Dashboard</a>
            <a href="/admin/patients" class="nav-item"><i class="bi bi-people nav-icon"></i> Patients</a>
            <a href="/admin/doctors" class="nav-item active"><i class="bi bi-person-badge nav-icon"></i> Doctors</a>
            <a href="/admin/departments" class="nav-item"><i class="bi bi-building nav-icon"></i> Departments</a>
            <a href="/admin/appointments" class="nav-item"><i class="bi bi-calendar2-check nav-icon"></i> Appointments</a>
            <div class="nav-section-label">Analytics</div>
            <a href="/admin/reports" class="nav-item"><i class="bi bi-graph-up nav-icon"></i> Reports</a>
        </nav>
        <div class="sidebar-footer"><a href="/logout" class="nav-item" style="color:rgba(255,255,255,0.6);"><i class="bi bi-box-arrow-left nav-icon"></i> Logout</a></div>
    </aside>
    <main class="main-content">
        <header class="top-header">
            <button id="sidebarToggle" class="sidebar-toggle"><i class="bi bi-list"></i></button>
            <div>
                <div class="header-title" th:text="${doctorId != null ? 'Edit Doctor' : 'Add New Doctor'}">Doctor Form</div>
                <div class="header-subtitle">Fill in doctor details</div>
            </div>
            <div class="header-actions"><a href="/admin/doctors" class="btn btn-outline btn-sm"><i class="bi bi-arrow-left"></i> Back</a></div>
        </header>
        <div class="page-content">
            <div class="card" style="max-width:860px;margin:0 auto;">
                <div class="card-header">
                    <h5 th:text="${doctorId != null ? 'Edit Doctor Profile' : 'New Doctor Registration'}">Doctor Form</h5>
                </div>
                <div class="card-body">
                    <form th:action="${doctorId != null ? '/admin/doctors/edit/' + doctorId : '/admin/doctors/add'}"
                          th:object="${doctorDto}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Full Name <span class="required">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="Doctor full name" required/>
                                <div class="form-error" th:if="${#fields.hasErrors('name')}"><i class="bi bi-exclamation-circle"></i> <span th:errors="*{name}"></span></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email Address <span class="required">*</span></label>
                                <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="doctor@healix.com" th:readonly="${doctorId != null}" required/>
                                <div class="form-error" th:if="${#fields.hasErrors('email')}"><i class="bi bi-exclamation-circle"></i> <span th:errors="*{email}"></span></div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Password <span th:text="${doctorId != null ? '(leave blank to keep)' : '*'}" class="required"></span></label>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="Min 6 characters" th:required="${doctorId == null}"/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" th:field="*{phone}" class="form-control" placeholder="+91 XXXXX XXXXX"/>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Specialization <span class="required">*</span></label>
                                <input type="text" th:field="*{specialization}" class="form-control" th:classappend="${#fields.hasErrors('specialization')} ? 'is-invalid'" placeholder="e.g. Cardiology" required/>
                                <div class="form-error" th:if="${#fields.hasErrors('specialization')}"><i class="bi bi-exclamation-circle"></i> <span th:errors="*{specialization}"></span></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Qualification <span class="required">*</span></label>
                                <input type="text" th:field="*{qualification}" class="form-control" th:classappend="${#fields.hasErrors('qualification')} ? 'is-invalid'" placeholder="e.g. MBBS, MD" required/>
                                <div class="form-error" th:if="${#fields.hasErrors('qualification')}"><i class="bi bi-exclamation-circle"></i> <span th:errors="*{qualification}"></span></div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Department</label>
                                <select th:field="*{departmentId}" class="form-control form-select">
                                    <option value="">Select department</option>
                                    <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">Department</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Years of Experience</label>
                                <input type="number" th:field="*{experienceYears}" class="form-control" placeholder="e.g. 10" min="0" max="50"/>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Consultation Fee (₹)</label>
                                <input type="number" th:field="*{consultationFee}" class="form-control" placeholder="e.g. 500" min="0" step="50"/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Availability</label>
                                <input type="text" th:field="*{availability}" class="form-control" placeholder="e.g. Mon-Sat: 9AM-5PM"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Address</label>
                            <input type="text" th:field="*{address}" class="form-control" placeholder="Full address"/>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Bio / Description</label>
                            <textarea th:field="*{bio}" class="form-control" rows="3" placeholder="Brief professional bio…"></textarea>
                        </div>

                        <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px;">
                            <a href="/admin/doctors" class="btn btn-outline">Cancel</a>
                            <button type="submit" class="btn btn-indigo">
                                <i class="bi bi-save"></i>
                                <span th:text="${doctorId != null ? 'Update Doctor' : 'Add Doctor'}">Save</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
