<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${patientId != null ? 'Edit Patient' : 'Add Patient'} + ' | Healix Admin'">Patient Form | Healix Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="app-layout">
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">H</div>
            <div><div class="sidebar-title">Healix</div><div class="sidebar-subtitle">Admin Portal</div></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">Main Menu</div>
            <a href="/admin/dashboard" class="nav-item"><i class="bi bi-speedometer2 nav-icon"></i> Dashboard</a>
            <a href="/admin/patients" class="nav-item active"><i class="bi bi-people nav-icon"></i> Patients</a>
            <a href="/admin/doctors" class="nav-item"><i class="bi bi-person-badge nav-icon"></i> Doctors</a>
            <a href="/admin/departments" class="nav-item"><i class="bi bi-building nav-icon"></i> Departments</a>
            <a href="/admin/appointments" class="nav-item"><i class="bi bi-calendar2-check nav-icon"></i> Appointments</a>
            <div class="nav-section-label">Analytics</div>
            <a href="/admin/reports" class="nav-item"><i class="bi bi-graph-up nav-icon"></i> Reports</a>
        </nav>
        <div class="sidebar-footer"><a href="/logout" class="nav-item" style="color:rgba(255,255,255,0.6);"><i class="bi bi-box-arrow-left nav-icon"></i> Logout</a></div>
    </aside>
    <main class="main-content">
        <header class="top-header">
            <button id="sidebarToggle" class="sidebar-toggle"><i class="bi bi-list"></i></button>
            <div>
                <div class="header-title" th:text="${patientId != null ? 'Edit Patient' : 'Add New Patient'}">Patient Form</div>
                <div class="header-subtitle">Fill in patient details</div>
            </div>
            <div class="header-actions">
                <a href="/admin/patients" class="btn btn-outline btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            </div>
        </header>
        <div class="page-content">
            <div th:if="${error}" class="alert alert-error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span></div>

            <div class="card" style="max-width:800px;margin:0 auto;">
                <div class="card-header">
                    <h5 th:text="${patientId != null ? 'Edit Patient Details' : 'New Patient Registration'}">Patient Form</h5>
                </div>
                <div class="card-body">
                    <form th:action="${patientId != null ? '/admin/patients/edit/' + patientId : '/admin/patients/add'}"
                          th:object="${patientDto}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Full Name <span class="required">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="Patient full name" required/>
                                <div class="form-error" th:if="${#fields.hasErrors('name')}"><i class="bi bi-exclamation-circle"></i> <span th:errors="*{name}"></span></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email Address <span class="required">*</span></label>
                                <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="email@example.com" th:readonly="${patientId != null}" required/>
                                <div class="form-error" th:if="${#fields.hasErrors('email')}"><i class="bi bi-exclamation-circle"></i> <span th:errors="*{email}"></span></div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Password <span th:text="${patientId != null ? '(leave blank to keep current)' : '*'}" class="required"></span></label>
                                <input type="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Min 6 characters" th:required="${patientId == null}"/>
                                <div class="form-error" th:if="${#fields.hasErrors('password')}"><i class="bi bi-exclamation-circle"></i> <span th:errors="*{password}"></span></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" th:field="*{phone}" class="form-control" placeholder="+91 XXXXX XXXXX"/>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Date of Birth</label>
                                <input type="date" th:field="*{dateOfBirth}" class="form-control"/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Gender</label>
                                <select th:field="*{gender}" class="form-control form-select">
                                    <option value="">Select gender</option>
                                    <option value="MALE">Male</option>
                                    <option value="FEMALE">Female</option>
                                    <option value="OTHER">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Blood Group</label>
                                <select th:field="*{bloodGroup}" class="form-control form-select">
                                    <option value="">Select blood group</option>
                                    <option value="A_POSITIVE">A+</option>
                                    <option value="A_NEGATIVE">A-</option>
                                    <option value="B_POSITIVE">B+</option>
                                    <option value="B_NEGATIVE">B-</option>
                                    <option value="AB_POSITIVE">AB+</option>
                                    <option value="AB_NEGATIVE">AB-</option>
                                    <option value="O_POSITIVE">O+</option>
                                    <option value="O_NEGATIVE">O-</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Address</label>
                                <input type="text" th:field="*{address}" class="form-control" placeholder="Full address"/>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Emergency Contact Name</label>
                                <input type="text" th:field="*{emergencyContactName}" class="form-control" placeholder="Contact person name"/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Emergency Contact Number</label>
                                <input type="tel" th:field="*{emergencyContact}" class="form-control" placeholder="+91 XXXXX XXXXX"/>
                            </div>
                        </div>

                        <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px;">
                            <a href="/admin/patients" class="btn btn-outline">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i>
                                <span th:text="${patientId != null ? 'Update Patient' : 'Add Patient'}">Save</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
