<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>An Error Occurred | Healix HMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F8F9FA;
            padding: 24px;
        }
        .error-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 48px;
            max-width: 540px;
            text-align: center;
            border: 1px solid #E5E7EB;
        }
        .error-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #FEF3C7;
            color: #D97706;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 24px;
        }
    </style>
</head>
<body>
<div class="error-page">
    <div class="error-card">
        <div class="error-icon">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h1 style="font-size: 1.8rem; font-weight: 800; color: #0F2042; margin-bottom: 8px;">Something went wrong</h1>
        <p style="color: #4B5563; font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px;"
           th:text="${error != null ? error : 'The page you are looking for encountered an unexpected condition or could not be found.'}">
            The page you are looking for encountered an unexpected condition.
        </p>
        <div th:if="${status != null}" style="margin-bottom: 20px; font-weight: 700; font-size: 1.1rem; color: #EF4444;">
            Status code: <span th:text="${status}">500</span>
        </div>
        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <a href="javascript:history.back()" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Go Back</a>
            <a href="/" class="btn btn-primary"><i class="bi bi-house"></i> Home Page</a>
        </div>
    </div>
</div>
</body>
</html>
